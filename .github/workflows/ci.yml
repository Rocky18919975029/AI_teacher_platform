name: quality
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.29
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest -q
      - run: node --test frontend/stream.test.cjs
      - run: uv export --locked --no-dev --extra rag --no-hashes --no-emit-project --output-file /tmp/teacher-runtime.txt
      # PyPI advisories identify upstream torch versions, not official +cpu wheel variants.
      - run: sed -E 's/^(torch==[0-9.]+)\+cpu/\1/' /tmp/teacher-runtime.txt > /tmp/teacher-audit.txt
      - run: uv run --no-sync pip-audit --strict --disable-pip --no-deps --progress-spinner off -r /tmp/teacher-audit.txt

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build --tag ai-teacher:ci .
