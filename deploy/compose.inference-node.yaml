# Run once on each RTX 4090 host. This is an independent replica, not a TP rank.
services:
  vllm:
    image: vllm/vllm-openai:v0.31.0-cu129
    restart: unless-stopped
    init: true
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?Supply the shared inference-only bearer key}
      VLLM_NO_USAGE_STATS: "1"
      HF_HOME: /model-cache
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --served-model-name
      - ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - --revision
      - ${VLLM_MODEL_REVISION:?Pin the model commit hash consistently across all replicas}
      - --dtype
      - bfloat16
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-4}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.88}
      - --enable-prefix-caching
      - --disable-log-requests
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - target: 8000
        published: "${VLLM_PORT:-8000}"
        host_ip: "${VLLM_BIND_HOST:-127.0.0.1}"
        protocol: tcp
    volumes:
      - inference-model-cache:/model-cache
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stop_grace_period: 120s

volumes:
  inference-model-cache: {}
