<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Teacher</title>

  <script src="https://unpkg.com/wavesurfer.js"></script>

  <style>
    body {
      margin: 0;
      background: #f7f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 780px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
      border-left: 1px solid #e3e3e3;
      border-right: 1px solid #e3e3e3;
    }

    #header {
      padding: 12px 16px;
      background: #007bff;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #header-title {
      font-size: 20px;
      font-weight: 600;
    }

    #header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #voice-select,
    #theme-toggle,
    #clear-btn {
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    #clear-btn {
      background: #ff7675;
      color: white;
    }

    #theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      background: rgba(255,255,255,0.2);
      color: white;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .bubble {
      padding: 12px 16px;
      margin-bottom: 16px;
      max-width: 75%;
      border-radius: 18px;
      line-height: 1.5;
    }

    .user {
      margin-left: auto;
      background: #d8ecff;
      border-bottom-right-radius: 6px;
    }

    .bot {
      margin-right: auto;
      background: #f0f0f0;
      border-bottom-left-radius: 6px;
    }

    .bubble-text {
      white-space: pre-wrap;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .audio-player {
      display: flex;
      flex-direction: column;
    }

    .control-btn {
      margin-top: 6px;
      padding: 4px 10px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
      width: 110px;
      font-size: 13px;
    }

    #typing {
      display: none;
      margin-left: 20px;
      margin-bottom: 16px;
      background: #f0f0f0;
      padding: 10px 16px;
      border-radius: 18px;
      opacity: 0.8;
      font-style: italic;
    }

    #input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: #fafafa;
    }

    #prompt {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      height: 45px;
      resize: none;
    }

    #send-btn {
      margin-left: 12px;
      padding: 0 20px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    /* ========== Dark Mode Styles ========== */
    body.dark {
      background: #020617;
    }

    body.dark #app {
      background: #020617;
      color: #e5e7eb;
      border-color: #1f2937;
    }

    body.dark #header {
      background: #0f172a;
    }

    body.dark #messages {
      background: #020617;
    }

    body.dark .user {
      background: #1d4ed8;
      color: #e5e7eb;
    }

    body.dark .bot {
      background: #111827;
      border: 1px solid #374151;
      color: #e5e7eb;
    }

    body.dark #typing {
      background: #111827;
      border-color: #374151;
      color: #e5e7eb;
    }

    body.dark #input-area {
      background: #020617;
      border-color: #111827;
    }

    body.dark #prompt {
      background: #020617;
      color: #e5e7eb;
      border-color: #374151;
    }

    body.dark #clear-btn {
      background: #b91c1c;
    }

    body.dark #voice-select {
      background: #111827;
      color: #e5e7eb;
    }

  </style>
</head>

<body>

<div id="app">

  <div id="header">
    <div id="header-title">AI Teacher</div>

    <div id="header-controls">
      <select id="voice-select">
        <option value="teacher_female">Female Teacher</option>
        <option value="teacher_male">Male Teacher</option>
      </select>

      <button id="clear-btn">Clear</button>
      <button id="theme-toggle">🌙</button>
    </div>
  </div>

  <div id="messages"></div>
  <div id="typing">AI Teacher is thinking…</div>

  <div id="input-area">
    <textarea id="prompt" placeholder="Ask me anything..."></textarea>
    <button id="send-btn">Send</button>
  </div>

</div>

<script>
  const API_URL = "http://localhost:9000/ai-teacher";

  let history = [];
  let currentWaveSurfer = null;

  const messagesDiv = document.getElementById("messages");
  const typingDiv = document.getElementById("typing");
  const promptInput = document.getElementById("prompt");
  const sendBtn = document.getElementById("send-btn");
  const clearBtn = document.getElementById("clear-btn");
  const themeToggle = document.getElementById("theme-toggle");
  const voiceSelect = document.getElementById("voice-select");

  // ========== Dark Mode ==========
  themeToggle.onclick = () => {
    document.body.classList.toggle("dark");
    themeToggle.innerText =
      document.body.classList.contains("dark") ? "☀️" : "🌙";
  };

  // ========== Clear Chat ==========
  clearBtn.onclick = () => {
    history = [];
    messagesDiv.innerHTML = "";
    if (currentWaveSurfer) currentWaveSurfer.destroy();
    addBubble("👋 Chat cleared.\nStart a new question!", "bot");
  };

  // ========== Bubble ==========
  function addBubble(text, sender) {
    const bubble = document.createElement("div");
    bubble.className = "bubble " + sender;

    const textDiv = document.createElement("div");
    textDiv.className = "bubble-text";
    textDiv.innerText = text;
    bubble.appendChild(textDiv);

    messagesDiv.appendChild(bubble);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    return { bubble, textDiv };
  }

  // ========== Typewriter ==========
  function streamText(textDiv, fullText, speed = 18) {
    let i = 0;
    function tick() {
      textDiv.innerText = fullText.slice(0, i);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      i++;
      if (i <= fullText.length) setTimeout(tick, speed);
    }
    tick();
  }

  // ========== WaveSurfer Player ==========
  function attachWavePlayer(bubble, audioURL) {
    const container = document.createElement("div");
    container.className = "audio-player";

    const waveformDiv = document.createElement("div");
    waveformDiv.style.width = "100%";
    waveformDiv.style.height = "60px";

    const controlBtn = document.createElement("button");
    controlBtn.className = "control-btn";
    controlBtn.innerText = "⏸️ Stop";

    container.appendChild(waveformDiv);
    container.appendChild(controlBtn);
    bubble.appendChild(container);

    const wavesurfer = WaveSurfer.create({
      container: waveformDiv,
      waveColor: "#90caf9",
      progressColor: "#007bff",
      height: 60,
      barWidth: 2,
      barGap: 2,
      autoScroll: true,
      autoCenter: false,
      responsive: true,
    });

    wavesurfer.load(audioURL);

    // autoplay when ready
    wavesurfer.on("ready", () => {
      wavesurfer.play();
    });

    controlBtn.onclick = () => {
      if (wavesurfer.isPlaying()) {
        wavesurfer.pause();
        controlBtn.innerText = "▶️ Continue";
      } else {
        wavesurfer.play();
        controlBtn.innerText = "⏸️ Stop";
      }
    };

    return wavesurfer;
  }

  // ========== Send Message ==========
  async function sendMessage() {
    const userText = promptInput.value.trim();
    if (!userText) return;

    addBubble(userText, "user");
    promptInput.value = "";

    history.push({ role: "user", text: userText });

    const convoPrompt = history
      .map(t => (t.role === "user" ? "Student: " : "Teacher: ") + t.text)
      .join("\n");

    typingDiv.style.display = "block";

    const resp = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: convoPrompt,
        with_audio: true,
        voice: voiceSelect.value,
      }),
    });

    const data = await resp.json();
    typingDiv.style.display = "none";

    history.push({ role: "assistant", text: data.text });

    const { bubble, textDiv } = addBubble("", "bot");
    streamText(textDiv, data.text);

    if (data.audio_url) {
      const url = "http://localhost:9000" + data.audio_url;

      if (currentWaveSurfer) currentWaveSurfer.destroy();
      currentWaveSurfer = attachWavePlayer(bubble, url);
    }
  }

  sendBtn.onclick = sendMessage;

  promptInput.onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  // initial welcome
  addBubble("👋 Hi! I’m your AI teacher.\nFeel free to ask me anything!", "bot");
</script>

</body>
</html>
